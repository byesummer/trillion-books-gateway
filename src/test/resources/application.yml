server:
  port: 0

spring:
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

