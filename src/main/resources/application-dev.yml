server:
  port: 10400

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
    config:
      enabled: false

# 라우팅 대상(uri.service.*)은 Config Server에서 주입.
# 로컬 단독 실행 시 아래를 프로파일/오버라이드로 지정:
#   eureka.client.enabled: false  (+ application.yml eureka 블록 무력화)
#   uri.service.auth: http://localhost:10401  등 정적 URI
#   또는 lb://auth-service 유지 (eureka 필요)
