server:
  port: 10400


spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
    config:
      enabled: false
eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.nhnacademy.gateway.GatewayApplication: DEBUG

