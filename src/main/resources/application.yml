# Gateway Service의 로컬 설정 파일
server:
  port: ${SERVER_PORT} # 포트는 실행 시 환경 변수로 주입

  # Config Server 연결을 위한 최소한의 설정

spring:
  config:
    import: configserver:http://config-server
  cloud:
    config:
      discovery:
        service-id: config-server

  application:
    name: gateway
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}