server:
  port: 10400
  ssl:
    enabled: true
    key-store: src/main/resources/bootsecurity.p12
    key-password: ${SSL_PW}  #__SSL_PASSWORD__
    key-store-type: PKCS12
    key-alias: bootsecurity

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
    config:
      enabled: false
eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.nhnacademy.gateway.GatewayApplication: DEBUG

