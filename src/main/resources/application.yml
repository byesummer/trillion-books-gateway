# Config Server 연결을 위한 최소한의 설정
spring:
  config:
    import: configserver:${CONFIG_SERVER_URI:http://localhost:10418}
  cloud:
    config:
      username: ***REMOVED***
      password: ***REMOVED***
  application:
    name: gateway

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://***REMOVED***:***REMOVED***@localhost:8761/eureka}
##---------------------------------------------------------------------------------------------------------
uri:
  service:
    auth: lb://auth-service
    member: lb://member-service
    book: lb://book-service
    order: lb://order-service
    coupon: lb://coupon-service
    search: lb://search-service

management:
  tracing:
    sampling:
      probability: 1.0 # 모든 로그를 찍는 설정이라 추후 조정 필요
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
