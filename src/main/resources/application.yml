# Config Server 연결을 위한 최소한의 설정
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:10418}
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
  application:
    name: gateway

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
