name: Gateway Docker Builder

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: nhnacademy-be12-trillion
  IMAGE_NAME: gateway
  JAVA_VERSION: 21
  DEPLOY_DIR: ~/msa-project

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests

#    - name: Run SonarQube
#      run: |
#        mvn sonar:sonar \
#        -Dsonar.projectKey=trillion-gateway \
#        -Dsonar.host.url=${{secrets.SONAR_HOST}} \
#        -Dsonar.token=${{secrets.SONAR_TOKEN}}

    - name: GitHub Packages 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ${{ env.REGISTRY }}

    - name: 이미지 태그 세팅
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest # latest 태그 고정

    - name: 도커 이미지 빌드 & 푸시
      uses: docker/build-push-action@v5
      with:
        context: .
        file: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}

    - name: 파일 전송 및 배포
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_IP }}
        username: ${{ secrets.SSH_ID }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}

      env:
        REGISTRY: ${{ env.REGISTRY }}
        REGISTRY_OWNER: ${{ env.REGISTRY_OWNER }}
        DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        script: |
          SERVICE_NAME_1="gateway-peer1"
          SERVICE_NAME_2="gateway-peer2"
          mkdir -p ${DEPLOY_DIR}
          cd ${DEPLOY_DIR}
          
          echo "Docker Registry 로그인"
          echo ${GHCR_TOKEN} | docker login ${REGISTRY} -u ${REGISTRY_OWNER} --password-stdin
          
          echo "최신 게이트웨이 이미지 Pull 및 서비스 재시작..."

          # 1. 최신 이미지 Pull (gateway:latest)
          docker-compose pull ${SERVICE_NAME_1} ${SERVICE_NAME_2}

          # 2. 게이트웨이 서비스만 재시작 (다른 서비스는 건드리지 않음)
          # --no-deps: 종속성(Eureka 등)을 건드리지 않음
          docker-compose up -d --no-deps ${SERVICE_NAME_1} ${SERVICE_NAME_2}

          echo "Docker Registry 로그아웃..."
          docker logout ${REGISTRY}
          
          echo "API Gateway Cluster 배포 완료!"