server:
  port: 10400
  forward-headers-strategy: framework
  ssl:
    enabled: true
    key-store: classpath:bootsecurity.p12
    key-store-password: ${SSL_PW}
    key-store-type: PKCS12
    key-alias: bootsecurity

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
    config:
      enabled: false
eureka:
  client:
    enabled: false

logging:
  level:
    com.nhnacademy.gateway.GatewayApplication: DEBUG

uri:
  service:
    member: http://localhost:10403
    book: http://localhost:10413
    order: http://localhost:10407
    coupon: http://localhost:10409
    search: http://localhost:10410
